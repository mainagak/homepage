<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude-Code-designed mark for FroEduX (v2, more finished pass than the
  original interim graduation-cap draft). Still pending the operator's own
  final brand decision, but intended as a real, presentable design rather
  than a placeholder.

  Concept: two page-leaves crossing to form an "X" (literal nod to the
  brand name and to FroEduX's actual product, Kindle e-books), rendered as
  a duotone mark rather than the more generic mortarboard/graduation-cap
  motif used in the prior draft. A single warm accent (the small dot,
  echoed in the wordmark's "X") is the one deliberate departure from the
  site's all-blue palette — a bookmark-tab reference, used sparingly.

  This remains the single source-of-truth logo image file referenced from
  every page's <header> (external-spec.md「ロゴ画像は1箇所の元データを更新すると、
  サイト内の全ての表示箇所に反映される構成にすること」、architecture.md
  決定事項T2「同一画像ファイルを複数ページから参照する形で十分」)。
  Replacing this file's contents is enough; no HTML changes are needed
  anywhere in site/.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 36" role="img" aria-labelledby="froeduxLogoTitle">
    <title id="froeduxLogoTitle">FroEduX</title>
    <defs>
        <linearGradient id="froeduxPageA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5dade2"/>
            <stop offset="100%" stop-color="#3498db"/>
        </linearGradient>
        <linearGradient id="froeduxPageB" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#1b4f72"/>
            <stop offset="100%" stop-color="#21618c"/>
        </linearGradient>
    </defs>

    <!-- icon: two leaves crossing into an X, ~32x32 -->
    <g transform="translate(17,18)">
        <path d="M -13,10 C -13,3 -8,-8 1,-13 C 5,-6 4,4 -2,10 C -6,13 -10,13 -13,10 Z"
              fill="url(#froeduxPageA)"/>
        <path d="M 13,10 C 13,3 8,-8 -1,-13 C -5,-6 -4,4 2,10 C 6,13 10,13 13,10 Z"
              fill="url(#froeduxPageB)" opacity="0.94"/>
        <circle cx="0" cy="11.5" r="2.1" fill="#e9a13a"/>
    </g>

    <text x="42" y="24" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
          font-size="19" font-weight="700" letter-spacing="0.2" fill="#ffffff">Fro<tspan fill="#ffffff">Edu</tspan><tspan fill="#e9a13a">X</tspan></text>
</svg>
