name: playwright-smoke

# Post-deploy / daily / on-demand smoke checks against the live Cyberhome site and
# the live Vercel API. Never performs destructive actions (architecture.md policy).
# Design source: docs/specs/internal-spec-repo-cicd.md 3.2, refined by
# docs/specs/internal-spec-testing.md 2, 4.3.
#
# NOTE (scaffolding): the actual Playwright test specs (tests/e2e/public/*.spec.ts)
# are added by a later Phase 6 task (テスト・CI/CD, per internal-spec.md 4章
# dependency order: データモデル・連携契約・リポジトリ構成 -> Cyberhome/Vercel側 ->
# テスト・CI/CDが最後). This workflow file defines the job skeleton the scenarios
# in internal-spec-testing.md 2.1 will run under.

on:
  schedule:
    - cron: "0 0 * * *" # daily, UTC 0:00 = JST 9:00
  workflow_call:
    inputs:
      triggered_by:
        type: string
        required: false
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["api/**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel deploy to become healthy (push-triggered only)
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.VERCEL_API_BASE_URL }}/health" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Vercel /health did not become healthy within 60s after api/** push"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium
      - name: Run public site smoke suite
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          VERCEL_API_BASE_URL: ${{ vars.VERCEL_API_BASE_URL }}
          SMOKE_TEST_SECRET: ${{ secrets.SMOKE_TEST_SECRET }}
        run: npx playwright test tests/e2e/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

  health-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -f -sS "${{ vars.VERCEL_API_BASE_URL }}/health" \
            | tee /dev/stderr | grep -q '"status":"ok"' \
            || (echo "::error::Vercel /health check failed" && exit 1)

  notify-on-failure:
    needs: [smoke, health-ping]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const failedJob = ${{ toJSON(needs) }};
            const triggeredBy = ${{ toJSON(inputs.triggered_by) }} || context.eventName;
            const label = "smoke-test-failure";
            const title = `Playwright smoke test failed (run #${context.runNumber}, triggered by ${triggeredBy})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label,
            });
            const body = [
              "## スモークテスト失敗通知(自動生成)",
              "",
              `- 対象コミット: ${context.sha}`,
              `- ワークフロー実行: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- 失敗ジョブ状況: smoke=${failedJob.smoke.result}, health-ping=${failedJob['health-ping'].result}`,
              "",
              "### 推奨対応",
              "1. 上記ワークフロー実行のログ・Playwrightレポートを確認する",
              "2. 本番サイト(https://jyoho1.web.cyberhome.ne.jp/)およびVercel API(/health)を目視確認する",
              "3. デプロイ起因と判断した場合はロールバックを検討する(docs/specs/internal-spec-testing.md 5章)",
              "4. 原因を修正後、workflow_dispatch で再実行する",
            ].join("\n");
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label], assignees: ["mainagak"],
              });
            }
